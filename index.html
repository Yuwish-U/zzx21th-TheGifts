<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>礼物清单</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; }

        /* 强制横屏与四周黑边 */
        #game-container { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            width: 95vh; 
            height: 53.4375vh; 
            transform: translate(-50%, -50%) rotate(90deg); 
            overflow: hidden; 
            background-color: #000; 
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15); 
        }

        .comic-filter { filter: grayscale(100%) contrast(130%) brightness(95%); }
        .img-highlight { box-shadow: 0 0 15px rgba(255, 255, 255, 0.6); border-radius: 4px; }
        .bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: none; transition: opacity 0.5s ease; }
        .screen.active { display: block; }

        .star-effect { position: absolute; color: #fff; font-size: 2vw; pointer-events: none; z-index: 9999; animation: floatUp 1s ease-out forwards; text-shadow: 0 0 5px #fff; }
        @keyframes floatUp { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; } 100% { transform: translate(-50%, -150%) scale(1.5); opacity: 0; } }
        
        .hotspot { position: absolute; z-index: 10; cursor: pointer; }
        #hotspot-drawer-bg { z-index: 5; }
        .drawer-item { position: absolute; z-index: 15; cursor: pointer; transition: transform 0.3s; }
        .drawer-item:hover { transform: scale(1.05); }
        .item-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 60%; max-height: 70%; z-index: 20; cursor: pointer; display: none; }

        /* ================= 完美横屏微信界面 ================= */
        #phone-modal { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 80%; height: 85%; background: #000; border-radius: 3vh; 
            box-shadow: 0 0 50px rgba(0,0,0,0.8); z-index: 100; display: none; 
            padding: 1vh; border: 2px solid #555; 
        }
        .phone-close-btn { position: absolute; top: -3vh; right: 0; width: 3vh; height: 3vh; background: rgba(255,255,255,0.2); color: #fff; border-radius: 50%; text-align: center; line-height: 2.8vh; font-size: 2vh; cursor: pointer; border: 1px solid rgba(255,255,255,0.5); }
        .phone-screen { width: 100%; height: 100%; background: #f2f2f7; border-radius: 2.5vh; overflow: hidden; display: flex; flex-direction: row; }
        
        .phone-sidebar { width: 25%; background: #e6e6e6; border-right: 1px solid #ccc; padding: 2vh; font-size: 1.5vh; color: #333; }
        .sidebar-title { font-weight: bold; margin-bottom: 2vh; font-size: 2vh; color: #000; }

        .chat-ui { flex: 1; display: none; flex-direction: column; background: #ededed; height: 100%; }
        .chat-main { flex: 1; display: flex; flex-direction: column; height: 100%; }
        .chat-header { height: 10%; background: #f2f2f7; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #ddd; font-size: 2vh; font-weight: bold; color: #000; position: relative; }
        .chat-header .back-btn { position: absolute; left: 3%; font-size: 3vh; cursor: pointer; }
        .chat-content { flex: 1; padding: 3%; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5vh; }
        
        .msg-row { display: flex; align-items: flex-start; gap: 1.5vh; width: 100%; }
        .msg-row.right { flex-direction: row-reverse; }
        .avatar { width: 4vh; height: 4vh; border-radius: 0.5vh; background: #ccc; flex-shrink: 0; object-fit: cover; }
        .msg-bubble { max-width: 70%; padding: 1vh 1.5vh; border-radius: 1vh; font-size: 1.6vh; line-height: 1.4; word-break: break-all; color: #000; position: relative; }
        .msg-bubble.left { background: #fff; }
        .msg-bubble.left::before { content: ''; position: absolute; left: -0.6vh; top: 1.2vh; border-width: 0.6vh 0.6vh 0.6vh 0; border-style: solid; border-color: transparent #fff transparent transparent; }
        .msg-bubble.right { background: #95ec69; }
        .msg-bubble.right::before { content: ''; position: absolute; right: -0.6vh; top: 1.2vh; border-width: 0.6vh 0 0.6vh 0.6vh; border-style: solid; border-color: transparent transparent transparent #95ec69; }
        .msg-img { max-width: 12vh; border-radius: 0.5vh; }
        
        .chat-input-bar { height: 10%; background: #f2f2f7; border-top: 1px solid #ddd; display: flex; align-items: center; padding: 0 3%; }
        .chat-input-bar input { flex: 1; height: 60%; border-radius: 1vh; border: 1px solid #ccc; padding: 0 3%; outline: none; background: #fff; font-size: 1.4vh; }

        .phone-home-screen { flex: 1; display: flex; justify-content: center; align-items: center; background-color: #e0e0e0; width: 100%; height: 100%; }
        .wechat-icon { width: 10vh; height: 10vh; background: #07c160; border-radius: 2vh; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .wechat-icon::after { content: "💬"; font-size: 5vh; }

        /* 弹窗与特效 */
        #wechat-notification { position: absolute; top: -100px; left: 50%; transform: translateX(-50%); width: 60%; background: rgba(250, 250, 250, 0.95); backdrop-filter: blur(10px); border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); z-index: 200; padding: 12px; display: flex; gap: 10px; align-items: center; transition: top 0.4s; }
        #wechat-notification.show { top: 10px; }
        #wechat-notification img { width: 40px; height: 40px; border-radius: 6px; }
        #wechat-notification .notify-name { font-size: 14px; font-weight: bold; color: #000; }
        #wechat-notification .notify-msg { font-size: 14px; color: #333; }
        
        /* 修复日出画面的显示 */
        #screen-sunrise { 
            background: linear-gradient(to bottom, #ff7e5f, #feb47b, #ffeba7, #4facfe); 
            z-index: 200 !important; /* 提高层级，防止被黑屏挡住 */
        }
        .silhouette { position: absolute; bottom: 10%; left: 10%; width: 8%; height: 25%; background: #111; clip-path: polygon(30% 100%, 40% 60%, 35% 20%, 50% 0%, 65% 20%, 60% 60%, 70% 100%); }
        .silhouette-2 { left: 25%; width: 7%; height: 23%; clip-path: polygon(20% 100%, 40% 50%, 30% 10%, 50% 0%, 70% 10%, 60% 50%, 80% 100%); }
        
        .outro-item { display: block; margin: 0 auto 2vh; max-width: 80%; opacity: 0; transition: opacity 2s ease-in-out; }
        .outro-item.show { opacity: 1; }
        
        #click-hint { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 24px; z-index: 9999; animation: pulse 1.5s infinite; pointer-events: none; text-shadow: 0 0 10px #000; font-weight: bold; }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    </style>
</head>
<body>

    <audio id="audio-houzuo"><source src="./assets/houzuo.mp3" type="audio/mpeg"></audio>
    <audio id="audio-zhkgo"><source src="./assets/zhkgo.mp3" type="audio/mpeg"></audio>

    <div id="game-container">
        <div id="wechat-notification">
            <img src="./assets/zhtouxiang.jpg" alt="头像">
            <div class="notify-text">
                <div class="notify-name">平安健康皆是福</div>
                <div class="notify-msg">小区门口等你。</div>
            </div>
        </div>
        
        <div id="click-hint">👆 请点击屏幕</div>

        <!-- 1. 主界面：补回了桌面手机热区 -->
        <div id="screen-main" class="screen active">
            <img src="./assets/zhujiemian.jpg" class="bg-img comic-filter" alt="主界面">
            <div class="hotspot" id="hotspot-drawer" style="bottom: 5%; right: 10%; width: 30%; height: 20%;"></div>
            <img src="./assets/yaoshi.jpg" class="drawer-item img-highlight" id="hidden-key" style="bottom: 15%; left: 8%; width: 4vw; opacity: 0.3; transform: rotate(15deg);" alt="钥匙">
            
            <!-- 桌面手机热区 -->
            <div class="hotspot" id="hotspot-phone-main" style="top: 40%; left: 25%; width: 10%; height: 15%; background: rgba(255,0,0,0.1);"></div>
            
            <div class="hotspot" id="easter-egg-cup" style="top: 20%; right: 25%; width: 5%; height: 10%;"></div>
        </div>

        <div id="screen-drawer" class="screen">
            <img src="./assets/chouti.jpg" class="bg-img comic-filter" alt="抽屉">
            <div class="hotspot" id="hotspot-drawer-bg" style="top: 0; left: 0; width: 100%; height: 100%;"></div>
            <img src="./assets/shoutao(ct).jpg" class="drawer-item img-highlight" id="item-shoutao" style="top: 40%; left: 20%; width: 15%; transform: rotate(-20deg);" alt="手套">
            <img src="./assets/guajian(ct).jpg" class="drawer-item img-highlight" id="item-guajian" style="top: 60%; left: 45%; width: 15%; transform: rotate(10deg);" alt="挂件">
            <img src="./assets/erding(ct).jpg" class="drawer-item img-highlight" id="item-erding" style="top: 30%; left: 65%; width: 12%; transform: rotate(45deg);" alt="耳钉">
            <img src="./assets/erding.jpg" class="item-display img-highlight" id="display-erding" alt="耳钉大图">
            <img src="./assets/shoutao.jpg" class="item-display img-highlight" id="display-shoutao" alt="手套大图">
            <img src="./assets/guajian.jpg" class="item-display img-highlight" id="display-guajian" alt="挂件大图">
        </div>

        <div id="screen-door" class="screen">
            <img src="./assets/men.jpg" class="bg-img comic-filter" id="door-img" alt="门">
        </div>

        <div id="screen-black" class="screen" style="background: #000; z-index: 500;"></div>

        <!-- 2. 修复了日出画面，用 flex 居中显示了两个人影 -->
        <div id="screen-sunrise" class="screen" style="display: none; background: linear-gradient(to bottom, #ff7e5f, #feb47b, #ffeba7, #4facfe); position: absolute; width:100%; height:100%;">
            <div class="silhouette"></div>
            <div class="silhouette silhouette-2"></div>
        </div>

        <div id="screen-outro" class="screen" style="background: #000; z-index: 600; display: none; text-align: center; padding-top: 5%;">
            <img src="./assets/21.jpg" class="outro-item" id="outro-21" style="max-height: 30vh;" alt="21">
            <div>
                <img src="./assets/daizheai.jpg" class="outro-item" id="outro-daizheai" style="display: inline-block; max-height: 30vh; margin-right: 2vw;" alt="带着爱">
                <img src="./assets/kgo.jpg" class="outro-item" id="outro-kgo" style="display: inline-block; max-height: 30vh;" alt="kgo">
            </div>
        </div>

        <div id="phone-modal">
            <div class="phone-close-btn" id="phone-close-btn">×</div>
            <div class="phone-screen">
                <div class="phone-sidebar">
                    <div class="sidebar-title">WeChat</div>
                    <div style="background:#fff; padding:1vh; border-radius:1vh; margin-bottom:1vh;">平安健康皆是福</div>
                </div>
                <div style="flex: 1; display: flex; flex-direction: column; width: 100%; height: 100%;">
                    <div class="phone-home-screen" id="phone-home">
                        <div class="wechat-icon" id="wechat-app"></div>
                    </div>
                    <div class="chat-ui" id="chat-ui">
                        <div class="chat-main">
                            <div class="chat-header">
                                <div class="back-btn" id="chat-back">‹</div>
                                <span id="chat-title">平安健康皆是福</span>
                            </div>
                            <div class="chat-content" id="chat-content"></div>
                            <div class="chat-input-bar"><input type="text" placeholder="发消息..." readonly></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const screens = document.querySelectorAll('.screen');
        let chatTimeout = null;
        let chatTarget = ''; 

        let audioCtx, bgmSource;
        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                fetch('./assets/keepgoingon.mp3').then(r => r.arrayBuffer()).then(b => audioCtx.decodeAudioData(b)).then(buffer => {
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    bgmSource = audioCtx.createBufferSource();
                    bgmSource.buffer = buffer;
                    bgmSource.loop = true;
                    const gain = audioCtx.createGain();
                    gain.gain.value = 0.2;
                    bgmSource.connect(gain); gain.connect(audioCtx.destination);
                    bgmSource.start(0);
                }).catch(e => console.log("背景音无法播放"));
            }
        }
        document.addEventListener('click', () => {
            if (!audioCtx) initAudioContext();
            else if (audioCtx.state === 'suspended') audioCtx.resume();
        });

        document.addEventListener('click', function(e) {
            if (document.getElementById('screen-black').classList.contains('active') || document.getElementById('screen-outro').classList.contains('active')) return;
            const star = document.createElement('div'); star.className = 'star-effect'; star.innerHTML = '✨';
            const rect = gameContainer.getBoundingClientRect();
            star.style.left = ((e.clientX - rect.left) / rect.width) * 100 + '%';
            star.style.top = ((e.clientY - rect.top) / rect.height) * 100 + '%';
            gameContainer.appendChild(star); setTimeout(() => star.remove(), 1000);
            if (phoneModal.style.display === 'block' && !phoneModal.contains(e.target)) forceClosePhone();
        });

        function showScreen(id) {
            screens.forEach(s => s.classList.remove('active'));
            const target = document.getElementById(id);
            if (target) target.classList.add('active');
            if (id === 'screen-drawer') document.querySelectorAll('.item-display').forEach(img => img.style.display = 'none');
        }

        document.getElementById('hotspot-drawer').addEventListener('click', (e) => { e.stopPropagation(); showScreen('screen-drawer'); });
        document.getElementById('hotspot-phone-main').addEventListener('click', (e) => { e.stopPropagation(); openPhone('eagle'); });
        document.getElementById('hidden-key').addEventListener('click', (e) => { e.stopPropagation(); });
        document.getElementById('easter-egg-cup').addEventListener('click', (e) => { e.stopPropagation(); alert('（纸团弹了一下）'); });

        document.getElementById('hotspot-drawer-bg').addEventListener('click', (e) => { showScreen('screen-main'); });
        document.getElementById('item-erding').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('display-erding').style.display = 'block'; document.getElementById('display-shoutao').style.display = 'none'; document.getElementById('display-guajian').style.display = 'none'; });
        document.getElementById('item-shoutao').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('display-shoutao').style.display = 'block'; document.getElementById('display-erding').style.display = 'none'; document.getElementById('display-guajian').style.display = 'none'; });
        document.getElementById('item-guajian').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('display-guajian').style.display = 'block'; document.getElementById('display-erding').style.display = 'none'; document.getElementById('display-shoutao').style.display = 'none'; });

        document.getElementById('display-erding').addEventListener('click', (e) => { e.stopPropagation(); openPhone('zuohang_erding'); });
        document.getElementById('display-shoutao').addEventListener('click', (e) => { e.stopPropagation(); openPhone('zuohang_shoutao'); });
        document.getElementById('display-guajian').addEventListener('click', (e) => { e.stopPropagation(); openPhone('zuohang_guajian'); });

        const phoneModal = document.getElementById('phone-modal');
        const phoneHome = document.getElementById('phone-home');
        const chatUI = document.getElementById('chat-ui');
        const chatContent = document.getElementById('chat-content');
        const chatTitle = document.getElementById('chat-title');
        const wechatApp = document.getElementById('wechat-app');
        const chatBack = document.getElementById('chat-back');
        const phoneCloseBtn = document.getElementById('phone-close-btn');

        function openPhone(chatType) {
            phoneModal.style.display = 'block';
            phoneHome.style.display = 'flex';
            chatUI.style.display = 'none';
            chatTarget = chatType;
        }
        phoneCloseBtn.addEventListener('click', (e) => { e.stopPropagation(); forceClosePhone(); });
        function forceClosePhone() {
            phoneModal.style.display = 'none'; chatContent.innerHTML = ''; if(chatTimeout) clearTimeout(chatTimeout);
            if (chatTarget.includes('zuohang')) showScreen('screen-drawer'); else if (chatTarget === 'eagle') showScreen('screen-main');
        }
        chatBack.addEventListener('click', (e) => {
            e.stopPropagation(); if(chatTimeout) clearTimeout(chatTimeout);
            chatUI.style.display = 'none'; phoneHome.style.display = 'flex'; chatContent.innerHTML = ''; 
        });
        wechatApp.addEventListener('click', (e) => {
            e.stopPropagation(); phoneHome.style.display = 'none'; chatUI.style.display = 'flex'; chatContent.innerHTML = '';
            if (chatTarget === 'eagle') startEagleChat();
            else if (chatTarget === 'zuohang_erding') startZuohangChat('erding');
            else if (chatTarget === 'zuohang_shoutao') startZuohangChat('shoutao');
            else if (chatTarget === 'zuohang_guajian') startZuohangChat('guajian');
        });

        function renderChatMsg(msg, isRight, avatarUrl, isImage = false) {
            const row = document.createElement('div'); row.className = `msg-row ${isRight ? 'right' : ''}`;
            const avatar = document.createElement('img'); avatar.className = 'avatar'; avatar.src = avatarUrl;
            const bubble = document.createElement('div'); bubble.className = `msg-bubble ${isRight ? 'right' : 'left'}`;
            if (isImage) { const img = document.createElement('img'); img.className = 'msg-img'; img.src = msg; bubble.appendChild(img); } else { bubble.textContent = msg; }
            row.appendChild(avatar); row.appendChild(bubble); chatContent.appendChild(row); chatContent.scrollTop = chatContent.scrollHeight;
        }

        function startZuohangChat(type) {
            chatTitle.textContent = '平安健康皆是福';
            const zzxAvatar = './assets/zzxtouxiang.jpg', zhAvatar = './assets/zhtouxiang.jpg';
            let msgs = [];
            if (type === 'erding') {
                msgs = [
                    { text: '今天拿回来的快递有一个是给你的礼物', isRight: false },
                    { text: './assets/erdingzzx.jpg', isRight: true, isImg: true },
                    { text: '这个吗？', isRight: true },
                    { text: '谢谢小航我很喜欢🥺', isRight: true },
                    { text: '但是你怎么想起来给我买克罗心了？', isRight: true },
                    { text: './assets/erdingzh.jpg', isRight: false, isImg: true },
                    { text: '一人一只', isRight: false },
                    { text: '左航好像喜欢朱志鑫', isRight: true },
                    { text: '可以把好像去掉', isRight: false }
                ];
            } else if (type === 'shoutao') {
                msgs = [
                    { text: '怎么还在给我买礼物？', isRight: true },
                    { text: './assets/shoutaozzx.jpg', isRight: true, isImg: true },
                    { text: '觉得你会喜欢就买了', isRight: false },
                    { text: '这把有感觉', isRight: false },
                    { text: '左航', isRight: true },
                    { text: '今年跟我一块过年吧', isRight: true },
                    { text: '我带你去滑雪', isRight: true },
                    { text: '你还打算带别人？', isRight: false }
                ];
            } else if (type === 'guajian') {
                msgs = [
                    { text: './assets/guajian.jpg', isRight: true, isImg: true },
                    { text: '这是我俩吗？', isRight: true },
                    { text: '对啊', isRight: false },
                    { text: '和我的兄弟们全部都坐上了DD BACKSEAT', isRight: false },
                    { text: '你咋还有空去拼豆', isRight: true },
                    { text: '可能因为我不是天天在家打游戏吧', isRight: false },
                    { text: '对了，说到打游戏。', isRight: true },
                    { text: '上号。', isRight: true },
                    { text: '。。。', isRight: false },
                    { text: '1', isRight: false },
                    { text: '礼貌申请甜双。', isRight: true }
                ];
            }
            let i = 0;
            function showNext() {
                if (i >= msgs.length) return;
                const m = msgs[i]; renderChatMsg(m.text, m.isRight, m.isRight ? zzxAvatar : zhAvatar, m.isImg);
                i++; chatTimeout = setTimeout(showNext, m.isImg ? 1500 : 1000);
            }
            showNext();
        }

        function startEagleChat() {
            chatTitle.textContent = 'eagle';
            const avatars = { zzx: './assets/zzxtouxiang.jpg', zh: './assets/zhtouxiang.jpg', zzy: './assets/zzytouxiang.jpg', zj: './assets/zjtouxiang.jpg', sxh: './assets/sxhtouxiang.jpg' };
            const msgs = [
                { id: 'zzy', text: '左航出去骑车了？', isRight: false },
                { id: 'zj', text: '你怎么知道？', isRight: false },
                { id: 'sxh', text: '应该是听到声音了吧！', isRight: false },
                { id: 'sxh', text: '我也听到了的！', isRight: false },
                { id: 'zzx', text: '怎么可能。', isRight: true },
                { id: 'zzx', text: '他车钥匙在我这儿啊！', isRight: true }
            ];
            let i = 0;
            function showNext() {
                if (i >= msgs.length) { chatTimeout = setTimeout(() => { forceClosePhone(); showWechatNotification(); }, 1000); return; }
                const m = msgs[i]; renderChatMsg(m.text, m.isRight, avatars[m.id]);
                i++; chatTimeout = setTimeout(showNext, 1200);
            }
            showNext();
        }

        function showWechatNotification() {
            const notify = document.getElementById('wechat-notification'); notify.classList.add('show');
            setTimeout(() => { notify.classList.remove('show'); setTimeout(() => { startDoorSequence(); }, 500); }, 3000);
        }

        let audioStep = 0, audioStepTriggered = false; 
        
        function startDoorSequence() {
            showScreen('screen-door'); document.getElementById('door-img').src = './assets/men.jpg';
            const doorImg = document.getElementById('door-img');
            const handleDoorClick = () => { doorImg.src = './assets/kaimen.jpg'; doorImg.removeEventListener('click', handleDoorClick); doorImg.addEventListener('click', handleEnterBlack); };
            doorImg.addEventListener('click', handleDoorClick);
            function handleEnterBlack(e) {
                e.stopPropagation(); 
                doorImg.removeEventListener('click', handleEnterBlack); 
                showScreen('screen-black');
                const hint = document.getElementById('click-hint'); 
                hint.style.display = 'block'; 
                hint.innerText = "👆 点击屏幕继续";
                
                const blackScreen = document.getElementById('screen-black');
                blackScreen.addEventListener('click', function playFirstAudio() {
                    blackScreen.removeEventListener('click', playFirstAudio); 
                    hint.style.display = 'none';
                    
                    const audioEl = document.getElementById('audio-houzuo'); 
                    audioEl.volume = 1.0; 
                    audioEl.play().catch(err => console.log(err));
                    
                    // 强制3秒后进入日出，不怕音频放不出来
                    setTimeout(onAudioEnded, 3500);
                });
            }
        }

        function onAudioEnded() {
            if (audioStepTriggered) return; 
            audioStepTriggered = true;
            
            if (audioStep === 0) {
                audioStep = 1; 
                showScreen('screen-sunrise');
                document.getElementById('screen-sunrise').style.display = 'flex'; // 修复：强制显示
                
                const hint = document.getElementById('click-hint'); 
                hint.style.display = 'block'; 
                hint.innerText = "👆 点击屏幕继续";
                
                const sunriseScreen = document.getElementById('screen-sunrise');
                sunriseScreen.addEventListener('click', function playSecondAudio() {
                    sunriseScreen.removeEventListener('click', playSecondAudio); 
                    hint.style.display = 'none'; 
                    audioStepTriggered = false; 
                    
                    const audioEl = document.getElementById('audio-zhkgo'); 
                    audioEl.volume = 1.0;
                    audioEl.play().catch(err => console.log(err));
                    
                    // 强制3秒后进入结尾
                    setTimeout(onAudioEnded, 3500);
                });
            } else if (audioStep === 1) {
                audioStep = 2; 
                showScreen('screen-black');
                setTimeout(() => {
                    showScreen('screen-outro'); 
                    document.getElementById('screen-outro').style.display = 'block';
                    setTimeout(() => document.getElementById('outro-21').classList.add('show'), 500);
                    setTimeout(() => document.getElementById('outro-daizheai').classList.add('show'), 1500);
                    setTimeout(() => document.getElementById('outro-kgo').classList.add('show'), 2500);
                }, 1000);
            }
        }
        phoneModal.addEventListener('click', (e) => e.stopPropagation());
    </script>
</body>
</html>
