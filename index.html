<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>朱志鑫二十一岁生贺-礼物</title>
  <style>
    :root { --ink: #151515; --paper: #e9e6dc; --line: #252525; --gold: #d9cba8; --vh: 100dvh; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; color: #161616; font-family: "Noto Serif SC","Songti SC",serif; touch-action: manipulation; }
    #landscape { position: absolute; width: min(100vw, 177.7778vh); height: min(100vh, 56.25vw); left: 50%; top: 50%; transform: translate(-50%,-50%); background: #111; padding: 1.15%; }
    @media (orientation: portrait) { #landscape { width: 100dvh; height: 100vw; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(90deg); transform-origin: center center; } }
    #stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #e7e4db; border: 1px solid #aaa; box-shadow: 0 0 0 1px #fff5,0 0 26px #fff2; isolation: isolate; }
    .scene { position: absolute; inset: 0; display: none; overflow: hidden; background: #e8e5dc; }
    .scene.active { display: block; }
    .scene:after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 1px #fff9,inset 0 0 50px #fff2; }
    .scene-img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1) contrast(1.04); }
    .hotspot { position: absolute; border: 1px solid transparent; background: transparent; cursor: pointer; z-index: 5; border-radius: 8px; }
    .hotspot:focus-visible { outline: 2px solid white; }
    #main .drawer-hit { right: 2%; bottom: 3%; width: 31%; height: 33%; }
    .key-hit { right: 3%; top: 3%; width: 17%; height: 30%; }
    #main .key-small { position: absolute; right: 8%; top: 7%; width: 7%; height: 14%; object-fit: contain; opacity: .88; filter: drop-shadow(0 0 5px #fff); pointer-events: none; }
    #drawer .item { position: absolute; width: 13%; height: 26%; object-fit: contain; cursor: pointer; filter: drop-shadow(0 0 5px #fff9); transition: transform .25s; }
    .item:hover { transform: scale(1.07); }
    #drawer .glove { left: 21%; top: 27%; }
    #drawer .charm { left: 47%; top: 42%; }
    #drawer .ear { left: 70%; top: 21%; }
    #detail { background: #111; }
    .detail-img { position: absolute; max-width: 62%; max-height: 80%; width: auto; height: auto; object-fit: contain; left: 50%; top: 50%; transform: translate(-50%,-50%); cursor: pointer; filter: drop-shadow(0 0 7px #fff9); }
    #zoom { background: #e6e2d8; }
    .zoom-key { position: absolute; right: 20%; top: 31%; width: 15%; height: 35%; object-fit: contain; filter: drop-shadow(0 0 7px white); }
    .zoom-phone { position: absolute; right: 39%; top: 28%; width: 11%; height: 43%; border-radius: 18px; background: linear-gradient(135deg,#222,#080808); border: 3px solid #aaa; box-shadow: 0 0 20px #fff8; cursor: pointer; animation: glow 2s infinite; }
    .zoom-phone:before { content: ""; position: absolute; inset: 5%; border-radius: 12px; background: linear-gradient(145deg,#e9e6df,#c8c4bb); }
    .zoom-phone:after { content: "●"; position: absolute; top: 8%; left: 47%; font-size: 7px; color: #333; }
    @keyframes glow { 50% { box-shadow: 0 0 28px #fff,0 0 48px #fff8; } }
    #chat-full { background: #eee; }
    .wechat-full { position: absolute; inset: 0; background: #ededed; display: flex; flex-direction: column; font-family: Arial,sans-serif; }
    .topbar { height: 9%; min-height: 34px; background: #f7f7f7; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: clamp(12px,1.3vw,20px); }
    .chat-stream { flex: 1; padding: 2% 6%; overflow: auto; background: #ededed; display: flex; flex-direction: column; gap: 1.5%; }
    .chat-row { display: flex; align-items: flex-start; gap: 1%; max-width: 80%; font-size: clamp(10px,1.1vw,17px); line-height: 1.4; }
    .chat-row.right { align-self: flex-end; flex-direction: row-reverse; }
    .avatar { width: clamp(24px,4vw,54px); height: clamp(24px,4vw,54px); border-radius: 6px; object-fit: cover; background: #ccc; flex-shrink: 0; }
    .bubble { padding: .65em .85em; border-radius: 8px; background: white; max-width: 100%; box-shadow: 0 1px 1px #0001; overflow-wrap: anywhere; }
    .right .bubble { background: #95ec69; }
    .sender { font-size: .75em; color: #888; margin-bottom: 3px; }
    .compose { height: 8%; min-height: 30px; background: #f7f7f7; border-top: 1px solid #ddd; display: flex; align-items: center; padding: 0 3%; color: #888; font-size: clamp(9px,1vw,14px); }
    #door, #dooropen { background: #090909; }
    #door img, #dooropen img { width: 100%; height: 100%; object-fit: cover; }
    #black { background: #000; }
    #sunrise { cursor: pointer; background: linear-gradient(#1a2340 0%,#7c6372 35%,#e9a77c 68%,#f8d7a0 100%); filter: saturate(1.1); }
    .sea { position: absolute; left: 0; right: 0; bottom: 0; height: 39%; background: linear-gradient(#dc9b82,#45566a 30%,#152e43 100%); }
    .sun { position: absolute; width: 12%; aspect-ratio: 1; border-radius: 50%; left: 50%; top: 48%; transform: translate(-50%,-50%); background: #fff0c6; box-shadow: 0 0 45px 20px #ffd9a7aa; }
    .shoreline { position: absolute; left: 0; right: 0; bottom: 31%; height: 2px; background: #fff8; box-shadow: 0 0 16px #fff; }
    .couple { position: absolute; bottom: 29%; left: 50%; transform: translateX(-50%); width: 22%; height: 28%; filter: drop-shadow(0 0 5px #161b26); }
    .couple:before, .couple:after { content: ""; position: absolute; bottom: 0; width: 29%; height: 72%; background: #171c28; border-radius: 40% 40% 10% 10%; }
    .couple:before { left: 19%; transform: rotate(-5deg); }
    .couple:after { right: 19%; transform: rotate(5deg); }
    .head { position: absolute; bottom: 66%; left: 34%; width: 16%; aspect-ratio: 1; border-radius: 50%; background: #1c202b; }
    .head.two { left: 52%; bottom: 67%; }
    #final { background: #000; color: #f1eee8; display: none; align-items: center; justify-content: center; }
    #final.active { display: flex; }
    .final-text { font-family: serif; letter-spacing: .12em; font-size: clamp(17px,3vw,42px); text-align: center; text-shadow: 0 0 15px #fff8; min-height: 1.5em; }
    /* phone overlay */
    #phone-layer { position: absolute; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: #0008; backdrop-filter: blur(2px); }
    #phone-layer.open { display: flex; }
    .outside { position: absolute; inset: 0; }
    .phone { position: relative; height: 92%; max-height: 92%; aspect-ratio: 9/19.2; width: auto; max-width: 46%; background: #111; border: clamp(3px,.5vw,7px) solid #444; border-radius: clamp(18px,2.3vw,34px); padding: 1.1%; box-shadow: 0 0 0 1px #ddd,0 0 28px #fff6; z-index: 1; display: flex; flex-direction: column; overflow: hidden; }
    .phone-screen { flex: 1; border-radius: clamp(12px,1.7vw,24px); overflow: hidden; background: #f5f5f5; display: flex; flex-direction: column; position: relative; }
    .notch { position: absolute; z-index: 4; top: 0; left: 50%; transform: translateX(-50%); width: 35%; height: 3%; background: #111; border-radius: 0 0 12px 12px; }
    .phone-home { height: 2.5%; display: flex; align-items: center; justify-content: center; }
    .homebar { width: 32%; height: 3px; border-radius: 9px; background: #aaa; }
    .phone-status { height: 6%; background: #f7f7f7; display: flex; align-items: center; justify-content: space-between; padding: 0 8%; font: 10px Arial; color: #222; }
    .app-grid { flex: 1; padding: 13% 9%; display: grid; grid-template-columns: repeat(3,1fr); grid-auto-rows: 24%; gap: 8%; align-content: start; }
    .app-icon { display: flex; flex-direction: column; align-items: center; gap: 5px; font: clamp(8px,.8vw,11px) Arial; color: #222; cursor: pointer; }
    .wechat-icon { width: 72%; aspect-ratio: 1; border-radius: 22%; background: #08bf62; position: relative; box-shadow: inset 0 -3px #00994d; }
    .wechat-icon:before, .wechat-icon:after { content: ""; position: absolute; background: white; border-radius: 50%; width: 48%; height: 40%; top: 27%; left: 18%; }
    .wechat-icon:after { width: 33%; height: 28%; left: 53%; top: 46%; box-shadow: 2px 3px 0 -1px #08bf62; }
    .wechat-icon i { position: absolute; z-index: 2; left: 29%; top: 37%; font-style: normal; color: #08bf62; font-size: 11px; }
    .phone-chat { display: none; flex: 1; flex-direction: column; background: #ededed; font-family: Arial,sans-serif; min-height: 0; }
    .phone-chat.visible { display: flex; }
    .phone-chat .topbar { height: 10%; min-height: 27px; font-size: clamp(9px,.9vw,13px); }
    .phone-chat .chat-stream { padding: 4.5% 4%; gap: 2.4%; }
    .phone-chat .chat-row { max-width: 94%; font-size: clamp(9px,.95vw,14px); gap: 2.5%; line-height: 1.45; }
    .phone-chat .avatar { width: clamp(25px,3vw,39px); height: clamp(25px,3vw,39px); border-radius: 7px; }
    .phone-chat .bubble { padding: .78em 1em; border-radius: 10px; max-width: calc(100% - 2px); }
    .phone-chat .compose { height: 9%; min-height: 25px; font-size: clamp(9px,.8vw,11px); }
    #tap-hint { position: absolute; z-index: 40; bottom: 2%; left: 50%; transform: translateX(-50%); font: clamp(9px,.9vw,13px) Arial; color: #fff; background: #0008; padding: .5em 1em; border-radius: 20px; pointer-events: none; opacity: 0; transition: opacity .2s; }
    #tap-hint.show { opacity: 1; }
    .spark { position: absolute; z-index: 60; pointer-events: none; color: #fff; text-shadow: 0 0 8px white,0 0 18px #fff; font-size: clamp(12px,2vw,26px); animation: spark .75s ease-out forwards; }
    @keyframes spark { 0% { opacity: 0; transform: scale(.2) rotate(0); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.6) rotate(40deg); } }
    #stage.color-mode .scene-img { filter: none; }
    @media (max-height:420px) { .phone { height: 94%; max-height: 94%; } .chat-row { font-size: 10px; } .phone-chat .chat-row { font-size: 8px; } }
    #music-toggle { position: absolute; z-index: 60; right: 2.2%; top: 2.2%; width: clamp(34px,4.2vw,54px); height: clamp(34px,4.2vw,54px); border: 1px solid #fff9; border-radius: 50%; background: #111b; color: #f5f1e8; font: clamp(17px,1.8vw,23px) Arial; display: grid; place-items: center; cursor: pointer; box-shadow: 0 0 12px #fff5; backdrop-filter: blur(4px); }
    #music-toggle.playing { background: #e9e6dc; color: #171717; border-color: #fff; }
    #incoming-banner { position: absolute; z-index: 80; top: 2.2%; left: 50%; transform: translate(-50%,-150%); width: min(58%,560px); min-height: clamp(54px,9vh,82px); padding: clamp(9px,1.2vw,16px) clamp(13px,1.6vw,22px); display: flex; align-items: center; gap: clamp(9px,1.2vw,16px); border: 1px solid #ffffffb8; border-radius: 16px; color: #171717; background: rgba(250,250,250,.96); box-shadow: 0 8px 34px #0005,0 0 14px #fff8; font: clamp(10px,1.05vw,15px) Arial,sans-serif; opacity: 0; pointer-events: none; backdrop-filter: blur(12px); }
    #incoming-banner.show { animation: banner-in .42s cubic-bezier(.2,.8,.2,1) forwards; }
    #incoming-banner .banner-avatar { width: clamp(32px,4vw,48px); height: clamp(32px,4vw,48px); border-radius: 11px; object-fit: cover; flex: none; }
    #incoming-banner .banner-copy { min-width: 0; flex: 1; }
    #incoming-banner .banner-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-weight: 700; }
    #incoming-banner .banner-time { font-size: .82em; color: #777; font-weight: 400; white-space: nowrap; }
    #incoming-banner .banner-message { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #333; }
    @keyframes banner-in { to { transform: translate(-50%,0); opacity: 1; } }
    @media (max-height:420px) { #incoming-banner { top: 1.5%; width: min(64%,520px); min-height: 48px; } }
  </style>
</head>
<body>
  <div id="landscape">
    <main id="stage">
      <section id="main" class="scene active">
        <img class="scene-img" src="assets/zhujiemian.jpg" alt="主界面">
        <img class="key-small" src="assets/yaoshi.jpg" alt="">
        <button class="hotspot drawer-hit" aria-label="打开抽屉" onclick="openDrawer()"></button>
        <button class="hotspot key-hit" aria-label="查看钥匙" onclick="openZoom()"></button>
      </section>
      <section id="drawer" class="scene">
        <img class="scene-img" src="assets/chouti.jpg" alt="抽屉俯视图">
        <img class="item glove" src="assets/shoutao(ct).jpg" onclick="showDetail('shoutao')" alt="手套">
        <img class="item charm" src="assets/guajian(ct).jpg" onclick="showDetail('guajian')" alt="挂件">
        <img class="item ear" src="assets/erding(ct).jpg" onclick="showDetail('erding')" alt="耳钉">
      </section>
      <section id="detail" class="scene">
        <img id="detail-image" class="detail-img" src="" alt="礼物" onclick="openGiftPhone()">
      </section>
      <section id="zoom" class="scene">
        <img class="scene-img" src="assets/zhujiemian.jpg" alt="桌面">
        <img class="zoom-key" src="assets/yaoshi(zm).jpg" alt="钥匙">
        <button class="zoom-phone" aria-label="打开手机" onclick="openGroupPhone()"></button>
      </section>
      <section id="chat-full" class="scene">
        <div class="wechat-full">
          <div class="topbar" id="full-title">eagle</div>
          <div class="chat-stream" id="full-stream"></div>
          <div class="compose">＋　输入消息</div>
        </div>
      </section>
      <section id="door" class="scene"><img src="assets/men.jpg" alt="门口"></section>
      <section id="dooropen" class="scene"><img src="assets/kaimen.jpg" alt="打开的门"></section>
      <section id="black" class="scene"></section>
      <section id="sunrise" class="scene">
        <div class="sun"></div>
        <div class="sea"></div>
        <div class="shoreline"></div>
        <div class="couple">
          <div class="head"></div>
          <div class="head two"></div>
        </div>
      </section>
      <section id="final" class="scene"><div class="final-text" id="final-text"></div></section>

      <!-- 手机弹窗 -->
      <div id="phone-layer">
        <div class="outside" onclick="closePhone()"></div>
        <div class="phone">
          <div class="phone-screen">
            <div class="notch"></div>
            <div class="phone-status"><span>9:41</span><span>●●● ▰</span></div>
            <div id="home-screen" class="app-grid">
              <div class="app-icon" onclick="openWeChat(event)">
                <div class="wechat-icon"><i>••</i></div>
                <span>微信</span>
              </div>
            </div>
            <div id="phone-chat" class="phone-chat">
              <div class="topbar" id="phone-title">平安健康皆是福</div>
              <div class="chat-stream" id="phone-stream"></div>
              <div class="compose">＋　按住 说话</div>
            </div>
          </div>
          <div class="phone-home"><div class="homebar"></div></div>
        </div>
      </div>

      <!-- 横幅通知 -->
      <div id="incoming-banner" aria-live="polite">
        <img class="banner-avatar" src="assets/zhtouxiang.jpg" alt="">
        <div class="banner-copy">
          <div class="banner-head"><span>平安健康皆是福</span><span class="banner-time">现在</span></div>
          <div class="banner-message">小区门口等你。</div>
        </div>
      </div>

      <button id="music-toggle" type="button" aria-label="播放背景音乐" title="播放背景音乐">♫</button>
      <div id="tap-hint"></div>

      <!-- 背景音乐（占位，实际使用时替换为你的音频文件路径） -->
      <audio id="bgm" loop preload="auto"></audio>
    </main>
  </div>

  <script>
    // ---------- 页面状态与工具 ----------
    const stage = document.getElementById('stage');
    const scenes = document.querySelectorAll('.scene');
    const bgm = document.getElementById('bgm');
    const musicToggle = document.getElementById('music-toggle');
    const tapHint = document.getElementById('tap-hint');
    let currentScene = 'main';
    let audioCtxUnlocked = false;
    let bgmStarted = false;

    // 背景音乐音量调小（微弱即可）
    bgm.volume = 0.12;

    // 切换场景
    function showScene(id) {
      scenes.forEach(s => s.classList.remove('active'));
      const target = document.getElementById(id);
      if (target) {
        target.classList.add('active');
        currentScene = id;
      }
    }

    // 显示提示文字
    function showHint(text) {
      if (!text) {
        tapHint.classList.remove('show');
        return;
      }
      tapHint.textContent = text;
      tapHint.classList.add('show');
    }

    // 隐藏提示
    function hideHint() {
      tapHint.classList.remove('show');
    }

    // 解锁音频上下文（用于点击黑屏/日出时播放音频）
    function unlockAudio() {
      if (audioCtxUnlocked) return;
      audioCtxUnlocked = true;
      if (bgm) {
        bgm.play().catch(() => {});
      }
    }

    // 播放/暂停背景音乐
    function toggleMusic() {
      if (!bgm) return;
      if (bgm.paused) {
        bgm.play().then(() => {
          musicToggle.classList.add('playing');
          bgmStarted = true;
        }).catch(() => {});
      } else {
        bgm.pause();
        musicToggle.classList.remove('playing');
      }
    }

    musicToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMusic();
    });

    // ---------- 主界面交互 ----------
    function openDrawer() {
      unlockAudio();
      showScene('drawer');
    }

    function openZoom() {
      unlockAudio();
      showScene('zoom');
    }

    // ---------- 抽屉物品 ----------
    const detailData = {
      shoutao: 'assets/shoutao(ct).jpg',
      guajian: 'assets/guajian(ct).jpg',
      erding: 'assets/erding(ct).jpg'
    };

    function showDetail(key) {
      unlockAudio();
      const img = document.getElementById('detail-image');
      if (detailData[key]) {
        img.src = detailData[key];
        showScene('detail');
      }
    }

    // 点击礼物图片打开手机
    function openGiftPhone() {
      unlockAudio();
      openPhoneLayer();
    }

    // ---------- 手机弹窗 ----------
    const phoneLayer = document.getElementById('phone-layer');
    const homeScreen = document.getElementById('home-screen');
    const phoneChat = document.getElementById('phone-chat');
    const phoneStream = document.getElementById('phone-stream');
    const phoneTitle = document.getElementById('phone-title');

    // 聊天数据（示例，可自行替换）
    const chatMessages = [
      { sender: '平安健康皆是福', text: '在吗？', avatar: 'assets/zhtouxiang.jpg', right: false },
      { sender: '我', text: '在的，怎么了？', avatar: 'assets/me.jpg', right: true },
      { sender: '平安健康皆是福', text: '小区门口等你。', avatar: 'assets/zhtouxiang.jpg', right: false }
    ];

    function openPhoneLayer() {
      phoneLayer.classList.add('open');
      homeScreen.style.display = 'grid';
      phoneChat.classList.remove('visible');
    }

    function closePhone() {
      phoneLayer.classList.remove('open');
    }

    function openWeChat(e) {
      e.stopPropagation();
      homeScreen.style.display = 'none';
      phoneChat.classList.add('visible');
      renderChat(phoneStream, chatMessages);
      phoneTitle.textContent = '平安健康皆是福';
    }

    // 渲染聊天消息
    function renderChat(container, messages) {
      container.innerHTML = '';
      messages.forEach(msg => {
        const row = document.createElement('div');
        row.className = 'chat-row' + (msg.right ? ' right' : '');
        const avatar = document.createElement('img');
        avatar.className = 'avatar';
        avatar.src = msg.avatar || 'assets/default-avatar.png';
        const bubbleWrap = document.createElement('div');
        const sender = document.createElement('div');
        sender.className = 'sender';
        sender.textContent = msg.sender;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = msg.text;
        bubbleWrap.appendChild(sender);
        bubbleWrap.appendChild(bubble);
        row.appendChild(avatar);
        row.appendChild(bubbleWrap);
        container.appendChild(row);
      });
      container.scrollTop = container.scrollHeight;
    }

    // ---------- 手机内的群聊（从缩放场景进入） ----------
    function openGroupPhone() {
      unlockAudio();
      openPhoneLayer();
      // 直接进入聊天界面
      homeScreen.style.display = 'none';
      phoneChat.classList.add('visible');
      renderChat(phoneStream, chatMessages);
      phoneTitle.textContent = 'eagle';
    }

    // ---------- 横幅通知（模拟） ----------
    const banner = document.getElementById('incoming-banner');
    function showBanner() {
      banner.classList.add('show');
      setTimeout(() => {
        banner.classList.remove('show');
      }, 3200);
    }

    // 点击横幅进入聊天
    banner.addEventListener('click', () => {
      banner.classList.remove('show');
      openPhoneLayer();
      homeScreen.style.display = 'none';
      phoneChat.classList.add('visible');
      renderChat(phoneStream, chatMessages);
      phoneTitle.textContent = '平安健康皆是福';
    });

    // ---------- 结局流程 ----------
    // 黑屏 / 日出：点击后播放音频（如果尚未播放），并推进剧情
    function gotoBlack() {
      unlockAudio();
      showScene('black');
      showHint('点击屏幕继续');
    }

    function gotoDoor() {
      unlockAudio();
      showScene('door');
      setTimeout(() => {
        showScene('dooropen');
        setTimeout(() => {
          showScene('black');
          showHint('点击屏幕继续');
        }, 1600);
      }, 1200);
    }

    function gotoSunrise() {
      unlockAudio();
      showScene('sunrise');
      showHint('点击屏幕');
      // 播放音频（如有需要可替换为指定音效）
      if (bgm.paused) {
        bgm.play().catch(() => {});
      }
    }

    function gotoFinal() {
      unlockAudio();
      showScene('final');
      const finalText = document.getElementById('final-text');
      finalText.textContent = '祝你二十一岁生日快乐';
      // 确保能看到结局：显示文字后，点击屏幕回到主界面
      finalText.style.cursor = 'pointer';
      finalText.onclick = (e) => {
        e.stopPropagation();
        resetToMain();
      };
      showHint('点击屏幕回到主界面');
    }

    // 回到主界面
    function resetToMain() {
      hideHint();
      showScene('main');
      // 重置手机弹窗状态
      phoneLayer.classList.remove('open');
      homeScreen.style.display = 'grid';
      phoneChat.classList.remove('visible');
      // 重新开始背景音乐（如果已暂停）
      if (bgm.paused && bgmStarted) {
        bgm.play().catch(() => {});
      }
    }

    // ---------- 事件监听 ----------
    // 点击黑屏 -> 进入日出
    document.getElementById('black').addEventListener('click', () => {
      if (currentScene === 'black') {
        hideHint();
        gotoSunrise();
      }
    });

    // 点击日出 -> 进入结局
    document.getElementById('sunrise').addEventListener('click', () => {
      if (currentScene === 'sunrise') {
        hideHint();
        gotoFinal();
      }
    });

    // 点击结局文字回到主界面（已在 gotoFinal 中绑定）
    // 点击其他空白区域也可返回（可选）
    document.getElementById('final').addEventListener('click', (e) => {
      if (e.target.id === 'final' || e.target.id === 'final-text') {
        resetToMain();
      }
    });

    // 点击 door 和 dooropen 推进剧情（可选，用于自动播放）
    document.getElementById('door').addEventListener('click', () => {
      if (currentScene === 'door') {
        showScene('dooropen');
        setTimeout(() => {
          showScene('black');
          showHint('点击屏幕继续');
        }, 1600);
      }
    });

    document.getElementById('dooropen').addEventListener('click', () => {
      if (currentScene === 'dooropen') {
        showScene('black');
        showHint('点击屏幕继续');
      }
    });

    // 初始化：尝试自动播放背景音乐（部分浏览器会阻止，需用户交互）
    window.addEventListener('load', () => {
      bgm.play().then(() => {
        musicToggle.classList.add('playing');
        bgmStarted = true;
      }).catch(() => {
        // 自动播放被阻止，等待用户点击
      });
    });

    // 用户首次点击页面时解锁音频
    document.body.addEventListener('click', () => {
      if (!audioCtxUnlocked) {
        unlockAudio();
        if (!bgmStarted) {
          bgm.play().then(() => {
            musicToggle.classList.add('playing');
            bgmStarted = true;
          }).catch(() => {});
        }
      }
    }, { once: true });

    // 点击主界面空白区域也可以解锁音频
    stage.addEventListener('click', (e) => {
      if (!audioCtxUnlocked) {
        unlockAudio();
      }
    });
  </script>
</body>
</html>
