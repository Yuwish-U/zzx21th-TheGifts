<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>礼物清单</title>
<style>
:root{--ink:#171717;--paper:#f5f4f0;--muted:#777;--line:#d8d6d0}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}
#viewport{position:fixed;inset:0;display:grid;place-items:center;background:#050505}
#stage{position:relative;width:min(94vw,160vh);height:auto;aspect-ratio:16/9;background:#e9e8e3;overflow:hidden;box-shadow:0 0 0 1px #222}
#stage,.screen{touch-action:manipulation}
.scene-image{object-position:center center}

#audioDock{position:absolute;right:1.8%;bottom:2%;z-index:60;display:flex;gap:6px;align-items:center;max-width:96%}
#audioDock button{border:1px solid rgba(255,255,255,.65);border-radius:18px;background:rgba(20,20,20,.72);color:#fff;padding:7px 10px;font-family:inherit;font-size:clamp(9px,1vw,12px);font-weight:500;line-height:1.2;letter-spacing:.02em;backdrop-filter:blur(6px);cursor:pointer}
#audioDock button:active{background:rgba(90,90,90,.9);transform:scale(.97)}
#audioDock button.playing{background:rgba(255,255,255,.9);color:#171717}
@media(orientation:portrait){
  #audioDock{right:2%;bottom:max(12px,env(safe-area-inset-bottom));gap:5px}
  #audioDock button{padding:7px 9px;font-size:10px}
  #soundHint{max-width:70%;font-size:10px}
}


.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.active{display:block}
#mainScreen{background:#eee}
.scene-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)}
#mainScreen:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.05),transparent 55%,rgba(0,0,0,.12))}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;z-index:4}
#drawerHotspot{left:8%;bottom:4%;width:36%;height:28%}
#keyHotspot{right:4%;bottom:4%;width:14%;height:18%}
.key-image{position:absolute;right:6%;bottom:7%;width:9%;height:14%;object-fit:contain;z-index:2;filter:drop-shadow(0 0 5px white);pointer-events:none}
.hint{position:absolute;left:2.5%;bottom:2%;z-index:5;color:#fff;background:rgba(0,0,0,.62);padding:.45em .8em;font-size:clamp(10px,1.1vw,16px);letter-spacing:.12em}
#drawerScreen{background:#deddd8}
#drawerScreen .scene-image{filter:grayscale(1)}
.drawer-item{position:absolute;width:18%;height:32%;object-fit:contain;cursor:pointer;filter:drop-shadow(0 0 7px rgba(255,255,255,.9));transition:transform .2s}
.drawer-item:hover{transform:scale(1.06)}
#itemScreen{background:#ecebe7;display:none;place-items:center}
#itemScreen.active{display:grid}
#itemLarge{width:auto;height:auto;max-width:min(48%,560px);max-height:62%;object-fit:contain;cursor:pointer;filter:drop-shadow(0 0 8px rgba(255,255,255,.95))}
#phoneScreen{background:rgba(0,0,0,.45);display:none;place-items:center;z-index:20}
#phoneScreen.active{display:grid}
.phone{
  width:min(78%,520px);
  height:auto;
  max-height:76%;
  aspect-ratio:18.8/9;
  background:#111;
  border:6px solid #292929;
  border-radius:2.5em;
  padding:8px;
  box-shadow:0 18px 55px #0009;
  position:relative;
}
.phone-inner{height:100%;width:100%;border-radius:1.9em;overflow:hidden;background:#f7f7f7;position:relative}
.notch{position:absolute;z-index:3;top:5px;left:50%;transform:translateX(-50%);width:32%;height:15px;border-radius:0 0 12px 12px;background:#111}
.phone-status{height:10%;padding:8px 18px 0;font-size:clamp(10px,1vw,13px);display:flex;justify-content:space-between;color:#222}
.phone-wallpaper{height:90%;background:linear-gradient(145deg,#e8e7e3,#fafafa);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.wechat-icon{width:15%;min-width:48px;aspect-ratio:1;border-radius:24%;background:#08bd62;display:grid;place-items:center;color:white;font-size:clamp(25px,3vw,44px);cursor:pointer;box-shadow:0 5px 15px #0002}
.app-label{font-size:clamp(9px,.9vw,13px);color:#333}
.phone-close{position:absolute;right:-2.4em;top:0;color:white;background:#111a;border:1px solid #fff6;border-radius:50%;width:2em;height:2em;cursor:pointer;font-size:16px}
.chat-app{height:100%;display:none;flex-direction:column;background:#ededed}
.chat-app.show{display:flex}
.chat-top{height:16%;min-height:48px;padding:20px 10px 7px;background:#f7f7f7;border-bottom:1px solid #ddd;text-align:center;font-size:clamp(13px,1.25vw,17px);font-weight:600;position:relative}
.chat-top small{display:block;font-weight:400;color:#888;font-size:.72em;margin-top:2px}
.back-chat{position:absolute;left:12px;top:19px;border:0;background:none;font-size:1.5em;color:#333}
.chat-messages{flex:1;min-height:0;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:11px}
.msg-row{display:flex;gap:9px;align-items:flex-start;max-width:88%}
.msg-row.right{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:clamp(32px,4.2vw,42px);height:clamp(32px,4.2vw,42px);border-radius:7px;object-fit:cover;background:#ccc;flex:none}
.msg-content{display:flex;flex-direction:column;gap:4px;max-width:min(78%,390px)}
.msg-name{font-size:clamp(10px,.85vw,12px);color:#888;line-height:1.2}
.bubble{padding:9px 12px;border-radius:9px;background:#fff;font-size:clamp(12px,1.05vw,15px);line-height:1.55;overflow-wrap:anywhere;box-shadow:0 1px 2px #00000012;color:#242424}
.right .bubble{background:#a6e58c}
.chat-photo{width:auto;height:auto;max-width:min(100%,150px);max-height:112px;object-fit:contain;border-radius:7px;background:#ddd;display:block}
.chat-footer{height:12%;min-height:34px;background:#f7f7f7;border-top:1px solid #ddd;display:flex;align-items:center;justify-content:center;color:#888;font-size:clamp(10px,.8vw,12px)}
.tap-tip{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);background:#111b;color:white;padding:7px 12px;border-radius:20px;font-size:clamp(8px,.75vw,11px);white-space:nowrap;pointer-events:none}
#groupScreen{background:#eee;z-index:10}
.group-bg{position:absolute;inset:0;background:linear-gradient(#f7f7f7 0 13%,#ededed 13%);display:flex;flex-direction:column}
.group-header{height:13%;display:grid;place-items:center;border-bottom:1px solid #ddd;font-size:clamp(13px,1.3vw,19px);font-weight:600}
.group-list{flex:1;padding:3% 8%;display:flex;flex-direction:column;gap:4%;overflow:hidden}
.group-message{display:flex;gap:12px;align-items:flex-start;max-width:75%}
.group-message.me{align-self:flex-end;flex-direction:row-reverse}
.group-message img{width:clamp(30px,4.5vh,44px);height:clamp(30px,4.5vh,44px);object-fit:cover;border-radius:7px;background:#ccc;flex:none}
.group-bubble{background:#fff;padding:8px 11px;border-radius:8px;font-size:clamp(11px,1.55vh,15px);line-height:1.5;box-shadow:0 1px 2px #0001}
.group-message.me .group-bubble{background:#a8e58e}
.group-name{font-size:clamp(9px,.8vw,12px);color:#888;margin-bottom:4px}
#transitionScreen{background:#000;z-index:15}
.full-image{width:100%;height:100%;object-fit:cover;display:block}
#blackScreen{background:#000;z-index:30;display:none;place-items:center;color:white;text-align:center}
#blackScreen.active{display:grid}
#sunriseScreen{z-index:25;background:linear-gradient(#f4b7a0 0%,#f6d4b1 38%,#f8dfba 57%,#7d9b9c 58%,#315a68 100%);display:none;place-items:center}
#sunriseScreen.active{display:grid}
.sun-caption{position:absolute;bottom:12%;color:#fff;font-size:clamp(12px,1.5vw,22px);letter-spacing:.25em;text-shadow:0 2px 6px #345}
.sun{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:13%;aspect-ratio:1;border-radius:50%;background:#fff0cf;box-shadow:0 0 55px 25px #fff4d2aa}
.sea-line{position:absolute;top:58%;width:100%;height:1px;background:#fff9;box-shadow:0 12px 30px #fff7}
.end-text{font-size:clamp(16px,2.2vw,32px);letter-spacing:.18em;line-height:1.8}
#toast{position:absolute;z-index:50;pointer-events:none;opacity:0;color:#fff;font-size:24px;text-shadow:0 0 9px #fff,0 0 18px #fff;transition:opacity .25s}
#toast.show{opacity:1}
#soundHint{position:absolute;right:2%;top:2%;z-index:40;color:#fff;background:#0009;padding:6px 10px;border-radius:20px;font-size:11px}
@media(orientation:portrait){
  .phone{width:min(82%,640px);max-height:64%;aspect-ratio:18.8/9;border-width:5px;border-radius:2em}
  .phone-close{right:-1.9em;top:-1.9em}
  .chat-messages{padding:10px 15px;gap:9px}
  .msg-row{gap:8px;max-width:90%}
  .avatar{width:clamp(30px,4.2vh,38px);height:clamp(30px,4.2vh,38px);border-radius:7px}
  .msg-content{max-width:78%}
  .bubble{font-size:clamp(11px,1.55vh,14px);padding:7px 10px;line-height:1.48;border-radius:8px}
  .msg-name{font-size:clamp(9px,1.15vh,11px)} 
  .chat-photo{max-width:min(100%,118px);max-height:82px}
  .group-list{padding:3% 6%;gap:3%}
  .group-message{gap:8px;max-width:88%}
  .group-bubble{font-size:clamp(11px,1.45vh,14px);padding:7px 10px}
  .group-name{font-size:10px}
  .chat-top{min-height:42px;padding-top:16px}
  .back-chat{top:13px}
}
@media(max-height:420px){
  .phone{width:min(78%,620px);max-height:88%}
  .chat-messages{gap:7px}
  .bubble{padding:7px 9px}
}
</style>
</head>
<body>
<div id="viewport">
<div id="stage">
  <section id="mainScreen" class="screen active">
    <img class="scene-image" src="assets/zhujiemian.jpg" alt="主界面">
    <img class="key-image" src="assets/yaoshi.jpg" alt="">
    <button class="hotspot" id="drawerHotspot" aria-label="打开抽屉"></button>
    <button class="hotspot" id="keyHotspot" aria-label="查看桌面角落"></button>
    <div class="hint">点击抽屉 · 查看礼物</div>
  </section>

  <section id="drawerScreen" class="screen">
    <img class="scene-image" src="assets/chouti.jpg" alt="抽屉俯视图">
    <img class="drawer-item" style="left:12%;top:20%;transform:rotate(-12deg)" src="assets/shoutao (ct).jpg" data-item="shoutao" alt="手套">
    <img class="drawer-item" style="left:42%;top:12%;transform:rotate(9deg)" src="assets/guajian (ct).jpg" data-item="guajian" alt="挂件">
    <img class="drawer-item" style="right:12%;bottom:13%;transform:rotate(-8deg)" src="assets/erding (ct).jpg" data-item="erding" alt="耳钉">
    <div class="hint">点击一件礼物查看 · 点击空白处返回</div>
  </section>

  <section id="itemScreen" class="screen">
    <img id="itemLarge" src="" alt="礼物特写">
    <div class="hint">点击礼物，打开手机</div>
  </section>

  <section id="phoneScreen" class="screen">
    <div class="phone">
      <div class="phone-inner">
        <div class="notch"></div>
        <div class="phone-status"><span>9:41</span><span>●●● ▰</span></div>
        <div class="phone-wallpaper" id="phoneHome">
          <div class="wechat-icon" id="wechatIcon">◉</div><div class="app-label">微信</div>
        </div>
        <div class="chat-app" id="privateChat">
          <div class="chat-top"><button class="back-chat" id="backHome">‹</button>平安健康皆是福<small>微信</small></div>
          <div class="chat-messages" id="privateMessages"></div>
          <div class="chat-footer">点击聊天区域，逐条查看消息</div>
        </div>
      </div>
      <button class="phone-close" id="closePhone" aria-label="关闭手机">×</button>
    </div>
    <div class="tap-tip" id="phoneTip">点击微信图标</div>
  </section>

  <section id="groupScreen" class="screen">
    <div class="group-bg">
      <div class="group-header">eagle</div>
      <div class="group-list" id="groupMessages"></div>
    </div>
    <div class="hint">点击屏幕继续</div>
  </section>

  <section id="transitionScreen" class="screen">
    <img id="transitionImage" class="full-image" src="" alt="">
    <div class="hint">点击屏幕继续</div>
  </section>

  <section id="blackScreen" class="screen">
    <div class="end-text" id="blackText"></div>
  </section>

  <section id="sunriseScreen" class="screen">
    <div class="sun"></div><div class="sea-line"></div>
    <div class="sun-caption">21 岁 · 海边日出</div>
  </section>
  <div id="toast">✦ ✧ ✨</div>
  <div id="soundHint">首次点击页面后播放背景音乐；也可使用右下角音频按钮</div>
  
<div id="audioDock" aria-label="音频播放控制">
  <button type="button" data-audio="bgm" title="背景音乐">♫ 背景</button>
  <button type="button" data-audio="voice1" title="播放 houzuo.mp3">① 后奏</button>
  <button type="button" data-audio="voice2" title="播放 zhkgo.mp3">② 结尾</button>
</div>

</div>
</div>

<audio id="bgm" src="assets/keepgoingon.mp3" loop preload="auto"></audio>
<audio id="voice1" src="assets/houzuo.mp3" preload="auto"></audio>
<audio id="voice2" src="assets/zhkgo.mp3" preload="auto"></audio>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const screens = ["mainScreen","drawerScreen","itemScreen","phoneScreen","groupScreen","transitionScreen","blackScreen","sunriseScreen"];
  let currentItem = "";
  let currentMessages = [];
  let messageIndex = 0;
  let groupIndex = 0;
  let flow = "";
  let endingStep = 0;
  let lastPoint = {x:0,y:0};

  const people = {
    zhu:{name:"朱志鑫",avatar:"assets/zzxtouxiang.jpg"},
    zuo:{name:"左航",avatar:"assets/zhtouxiang.jpg"},
    zzy:{name:"张泽禹",avatar:"assets/zzytouxiang.jpg"},
    zj:{name:"张极",avatar:"assets/zjtouxiang.jpg"},
    sxh:{name:"苏新皓",avatar:"assets/sxhtouxiang.jpg"}
  };

  const chats = {
    erding:[
      {who:"zuo",text:"今天那个快递有一个时候你的生日礼物。"},
      {who:"zhu",image:"assets/erdingzzx.jpg"},
      {who:"zhu",text:"这个吗"},
      {who:"zhu",text:"谢谢小航我很喜欢 🥺"},
      {who:"zhu",text:"但是你怎么想起来给我买克罗心了？"},
      {who:"zuo",image:"assets/erdingzh.jpg"},
      {who:"zuo",text:"一人一只"},
      {who:"zhu",text:"左航好像喜欢朱志鑫"},
      {who:"zuo",text:"可以把好像去掉"}
    ],
    shoutao:[
      {who:"zhu",text:"怎么还在给我买礼物？"},
      {who:"zhu",image:"assets/shoutaozzx.jpg"},
      {who:"zuo",text:"觉得你会喜欢就买了"},
      {who:"zuo",text:"这把有感觉"},
      {who:"zhu",text:"左航"},
      {who:"zhu",text:"今年跟我一块过年吧"},
      {who:"zuo",text:"要带我一起去滑雪吗？"},
      {who:"zhu",text:"当然！"}
    ],
    guajian:[
      {who:"zhu",image:"assets/guajian.jpg"},
      {who:"zhu",text:"这是我俩吗？"},
      {who:"zuo",text:"对啊"},
      {who:"zuo",text:"和我的兄弟们全部都坐上了 DD BACKSEAT"},
      {who:"zhu",text:"你咋还有空去拼豆"},
      {who:"zuo",text:"我没有电竞梦了"},
      {who:"zhu",text:"对了，说到电竞梦。"},
      {who:"zhu",text:"上号。"},
      {who:"zhu",text:"礼貌申请甜双。"},
      {who:"zuo",text:"1。"}
    ]
  };

  const groupChat = [
    {who:"zzy",text:"左航出去骑车了？"},
    {who:"zj",text:"你怎么知道？"},
    {who:"sxh",text:"应该是听到声音了吧！"},
    {who:"sxh",text:"我也听到了的！"},
    {who:"zhu",text:"怎么可能。"},
    {who:"zhu",text:"他车钥匙在我这儿啊！"}
  ];

  function show(id){
    screens.forEach(s=>$(s).classList.toggle("active",s===id));
  }
  function sparkle(e){
    const r=$("stage").getBoundingClientRect();
    const x=e.clientX-r.left, y=e.clientY-r.top;
    $("toast").style.left=(x-15)+"px"; $("toast").style.top=(y-15)+"px";
    $("toast").classList.remove("show"); void $("toast").offsetWidth; $("toast").classList.add("show");
    setTimeout(()=>$("toast").classList.remove("show"),450);
  }
  $("stage").addEventListener("pointerdown",e=>sparkle(e));

  let bgmStarted = false;
  function playTrack(id){
    const audio=$(id);
    if(!audio) return;
    if(id==="bgm") audio.volume=.42;
    else audio.volume=1;
    audio.play().then(()=>{
      document.querySelectorAll('#audioDock button').forEach(b=>b.classList.toggle('playing',b.dataset.audio===id));
      $("soundHint").style.display="none";
    }).catch(()=>{
      $("soundHint").textContent="播放未启动，请再点一次对应音频按钮";
      $("soundHint").style.display="block";
    });
  }
  function playBgm(){
    if(bgmStarted) return;
    bgmStarted=true;
    playTrack("bgm");
  }
  // 浏览器禁止无手势自动播放：进入网页后的首次点击启动背景音乐。
  document.addEventListener("pointerdown",playBgm,{once:true});
  document.querySelectorAll("#audioDock button").forEach(button=>{
    button.addEventListener("pointerdown",e=>e.stopPropagation());
    button.addEventListener("click",e=>{
      e.stopPropagation();
      const id=button.dataset.audio, audio=$(id);
      if(audio.paused){playTrack(id);}
      else {audio.pause();button.classList.remove("playing");}
    });
  });
  ["bgm","voice1","voice2"].forEach(id=>{
    $(id).addEventListener("ended",()=>{
      const button=document.querySelector(`#audioDock button[data-audio="${id}"]`);
      if(button) button.classList.remove("playing");
    });
  });

  $("drawerHotspot").onclick=()=>show("drawerScreen");
  $("keyHotspot").onclick=()=>{ show("mainScreen"); $("soundHint").textContent="桌面角落的小小钥匙"; $("soundHint").style.display="block"; setTimeout(()=>$("soundHint").style.display="none",1600); };
  $("drawerScreen").addEventListener("click",e=>{
    if(e.target=== $("drawerScreen") || e.target.classList.contains("scene-image")) show("mainScreen");
  });
  document.querySelectorAll(".drawer-item").forEach(img=>{
    img.addEventListener("click",e=>{
      e.stopPropagation(); currentItem=img.dataset.item;
      $("itemLarge").src=`assets/${currentItem}.jpg`;
      show("itemScreen");
    });
  });
  $("itemLarge").onclick=()=>openPhone(currentItem);

  function openPhone(item){
    flow="private"; currentMessages=chats[item]||[]; messageIndex=0;
    $("phoneHome").style.display="flex"; $("privateChat").classList.remove("show");
    $("phoneTip").textContent="点击微信图标";
    show("phoneScreen");
  }
  $("wechatIcon").onclick=()=>{
    $("phoneHome").style.display="none"; $("privateChat").classList.add("show");
    $("phoneTip").textContent="点击聊天区域，逐条查看";
    renderPrivate();
  };
  $("backHome").onclick=()=>{
    $("privateChat").classList.remove("show"); $("phoneHome").style.display="flex";
    $("phoneTip").textContent="点击微信图标";
  };
  $("closePhone").onclick=()=>{
    show("drawerScreen");
  };
  $("phoneScreen").addEventListener("click",e=>{
    if(e.target===$("phoneScreen")) show("drawerScreen");
  });

  function renderPrivate(){
    const box=$("privateMessages"); box.innerHTML="";
    messageIndex=0; appendPrivate();
    box.onclick=()=>{
      if(messageIndex<currentMessages.length) appendPrivate();
      else { show("drawerScreen"); }
    };
  }
  function appendPrivate(){
    if(messageIndex>=currentMessages.length)return;
    const m=currentMessages[messageIndex++], p=people[m.who], right=m.who==="zhu";
    const row=document.createElement("div"); row.className="msg-row"+(right?" right":"");
    const avatar=document.createElement("img"); avatar.className="avatar"; avatar.src=p.avatar; avatar.alt="";
    const content=document.createElement("div"); content.className="msg-content";
    const name=document.createElement("div"); name.className="msg-name"; name.textContent=p.name;
    const bubble=document.createElement("div"); bubble.className="bubble";
    if(m.image){const im=document.createElement("img"); im.className="chat-photo"; im.src=m.image; im.alt="聊天图片"; bubble.append(im);}
    else bubble.textContent=m.text;
    content.append(name,bubble); row.append(avatar,content); $("privateMessages").append(row);
    $("privateMessages").scrollTop=$("privateMessages").scrollHeight;
  }

  function renderGroup(){
    const box=$("groupMessages"); box.innerHTML="";
    groupIndex=0; appendGroup();
  }
  function appendGroup(){
    if(groupIndex>=groupChat.length)return;
    const m=groupChat[groupIndex++],p=people[m.who];
    const row=document.createElement("div"); row.className="group-message";
    const av=document.createElement("img"); av.src=p.avatar; av.alt="";
    const wrap=document.createElement("div");
    const name=document.createElement("div"); name.className="group-name"; name.textContent=p.name;
    const bubble=document.createElement("div"); bubble.className="group-bubble"; bubble.textContent=m.text;
    wrap.append(name,bubble);row.append(av,wrap);$("groupMessages").append(row);
  }

  $("mainScreen").addEventListener("click",e=>{
    if(e.target===$("mainScreen") || e.target.classList.contains("scene-image")){}
  });

  function showTransition(src){
    $("transitionImage").src=src; show("transitionScreen");
  }
  $("groupScreen").onclick=()=>{
    if(groupIndex<groupChat.length){appendGroup();return;}
    show("phoneScreen");
    $("phoneHome").style.display="none"; $("privateChat").classList.add("show");
    $("phoneTip").textContent="小航发来一条新消息";
    $("privateMessages").innerHTML="";
    const row=document.createElement("div");row.className="msg-row";
    const av=document.createElement("img");av.className="avatar";av.src=people.zuo.avatar;
    const wrap=document.createElement("div");wrap.className="msg-content";
    const name=document.createElement("div");name.className="msg-name";name.textContent="平安健康皆是福";
    const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent="小区门口等你。";
    wrap.append(name,bubble);row.append(av,wrap);$("privateMessages").append(row);
    $("privateMessages").onclick=()=>showTransition("assets/men.jpg");
  };

  $("transitionScreen").onclick=()=>{
    if($("transitionImage").src.includes("men.jpg")) showTransition("assets/kaimen.jpg");
    else if($("transitionImage").src.includes("kaimen.jpg")){
      show("blackScreen"); $("blackText").textContent="";
      $("voice1").currentTime=0; playTrack("voice1");
      $("voice1").onended=()=>{show("sunriseScreen"); $("voice2").currentTime=0; playTrack("voice2");};
    }
  };
  $("sunriseScreen").onclick=()=>{
    if(!$("voice2").paused) return;
    show("blackScreen");
    $("blackText").textContent="";
    typeText("21 岁，带着爱，keep going on");
  };
  function typeText(text){
    let i=0; const target=$("blackText");
    const timer=setInterval(()=>{
      target.textContent+=text[i++]||"";
      if(i>text.length)clearInterval(timer);
    },150);
  }

  // 桌面角落手机：从主界面钥匙附近再次点击可进入群聊入口
  $("keyHotspot").addEventListener("dblclick",()=>{
    renderGroup();show("groupScreen");
  });
  // 触屏设备没有双击的场景下，长按区域不作强制依赖；主界面右上角小提示可进入群聊。
  const groupEntry=document.createElement("button");
  groupEntry.className="hotspot";groupEntry.style.cssText="right:1%;top:1%;width:9%;height:12%;z-index:6";
  groupEntry.setAttribute("aria-label","打开群聊手机");
  groupEntry.onclick=()=>{renderGroup();show("groupScreen");};
  $("mainScreen").append(groupEntry);
})();
</script>
</body>
</html>
